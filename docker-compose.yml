# Local development database. Production uses Neon Postgres via Vercel.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: instantlive
      POSTGRES_PASSWORD: instantlive
      POSTGRES_DB: instantlive
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
